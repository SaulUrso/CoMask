common_args:
  training_type: "simulation"
  random_seed: 0

data_args:
  dataset: "femnist"
  partition_method: "natural"
  feature_col: writer_id

model_args:
  model: "mobilenet"

train_args:
  federated_optimizer: "FedAvg"
  client_id_list: "[]"  # Adjust based on num_clients
  client_num_in_total: 100 # ignored
  client_num_per_round: 30
  comm_round: 200
  learning_rate: 0.01
  weight_decay: 0.001
  epochs: 5
  batch_size: -1
  client_optimizer: "sgd"


validation_args:
  frequency_of_the_test: 10
  test_only_users: 597

device_args:
  using_gpu: true
  gpu_id: 0

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: true
  wandb_entity: s-urso2
  wandb_project: "FedFEMNIST"
  run_name: "run_mobilenet_femnist"

