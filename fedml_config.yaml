common_args:
  training_type: "simulation"
  random_seed: 0

data_args:
  dataset: "cifar10"
  data_cache_dir: "../data/cifar10"
  partition_method: "hetero"
  partition_alpha: 0.5

model_args:
  model: "cnn_web" # logistic regression

