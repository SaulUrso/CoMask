program: scripts/cluster_prune_script.py
method: grid
name: comask_4clust_dir0.5
project: comask_clust_grid
entity: s-urso2
metric:
  name: Server/FullTest/Acc
  goal: maximize

parameters:
  train_args:
    parameters:
      n_clusters:
        values: [4]

      group_method:
        values: ["clusters"]

      pruning:
        values: ["proposal"]

      # --- grid axis (CoMask-specific knob) ---
      ssl_coefficient:
        values: [0, 0.0001, 0.001, 0.01, 0.1]

      # --- fixed across all experiments ---
      accuracy_threshold:
        values: [0.2]

      learning_rate:
        values: [0.1]

      weight_decay:
        values: [0.0001]

      comm_round:
        values: [250]

      consensus_percentage:
        values: [0.2]

      prune_counter:
        values: [3]

      prune_percent:
        values: [0.1]

      consolidation_percentage:
        values: [0.1]

      client_num_in_total:
        values: [100]

  validation_args:
    parameters:
      frequency_of_the_test:
        values: [125]

  data_args:
    parameters:
      partition_method:
        values: ["label"]

      method_name:
        values: ["dirichlet"]

      data_split_alpha:
        values: [0.1]

      min_require_size:
        values: [1]


command:
  - uv
  - run
  - --no-sync
  - --env-file
  - .env
  - --
  - ${program}
  - --cf
  - configs/cifar_config.yaml
