program: scripts/personal_pruning_script.py 
method: grid  # or 'grid', 'random'
metric:
  name: Global/Test/Acc  # FedML typically logs as 'test/acc' or 'test_acc'
  goal: maximize

parameters:
  train_args:
    parameters:
      prune_percent: 
        values: [0.05,0.1,0.15,0.2,0.25]

  device_args:
    parameters:
      gpu_id: 
        values: [1]

        
command:
  - uv
  - run
  - --env-file
  - .env
  - --
  - ${program}
  - --cf
  - configs/femnist_config.yaml