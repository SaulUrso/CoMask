program: scripts/my_fedml_script.py
method: grid
name: fedavg_dir5_cifar
project: FedCIFAR10
entity: s-urso2
metric:
  name: Server/Test/Acc
  goal: maximize

parameters:
  train_args:
    parameters:
      learning_rate:
        values: [0.1]

      weight_decay:
        values: [0.0001]

      comm_round:
        values: [500]

      client_num_in_total:
        values: [100]

  data_args:
    parameters:
      partition_method:
        values: ["label"]

      method_name:
        values: ["dirichlet"]

      data_split_alpha:
        values: [5]

      min_require_size:
        values: [1]
        
  validation_args:
    parameters:
      frequency_of_the_test:
        values: [100]
command:
  - uv
  - run
  - --no-sync
  - --env-file
  - .env
  - --
  - ${program}
  - --cf
  - configs/cifar_config.yaml
