program: scripts/pacfl_script.py
method: grid
name: pacfl_dir0.5_cifar
project: pacfl_baseline
entity: s-urso2
metric:
  name: Server/FullTest/Acc
  goal: maximize

parameters:
  train_args:
    parameters:
      group_method:
        values: ["clusters"]

      linkage_method:
        values: ["average"]

      # --- swept axis: fixed cluster count (matches the CoMask grids for head-to-head comparison) ---
      # HC cuts the dendrogram to exactly this many clusters (criterion="maxclust").
      n_clusters:
        values: [2, 4, 8]

      n_basis:
        values: [5]

      learning_rate:
        values: [0.1]

      weight_decay:
        values: [0.0001]

      epochs:
        values: [5]

      comm_round:
        values: [250]

      client_num_in_total:
        values: [100]

      client_num_per_round:
        values: [0.1]

  validation_args:
    parameters:
      frequency_of_the_test:
        values: [100]

  data_args:
    parameters:
      partition_method:
        values: ["label"]

      method_name:
        values: ["dirichlet"]

      data_split_alpha:
        values: [0.5]

      min_require_size:
        values: [1]


command:
  - uv
  - run
  - --no-sync
  - --env-file
  - .env
  - --
  - ${program}
  - --cf
  - configs/cifar_config.yaml
