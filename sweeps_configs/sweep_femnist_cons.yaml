program: scripts/cluster_prune_script.py 
method: grid  
metric:
  name: Server/Test/Acc  
  goal: maximize

parameters:
  train_args:
    parameters:
      preference:
        values : [-200, -90, -43] # [-200, -90, -43]
      
      pruning: 
        values : ["proposal"]

      ssl_coefficient:
        values: [0.0001]

      accuracy_threshold:
        values : [0.1]

      prune_percent: 
        values: [0.1]

      consolidation_percentage: 
        values: [0.1]

      consensus_percentage: 
        values: [0.1,0.3,0.5,0.7]

  device_args:
    parameters:
      gpu_id: 
        values: [0]
        
command:
  - uv
  - run
  - --env-file
  - .env
  - --
  - ${program}
  - --cf
  - configs/femnist_config.yaml