program: scripts/personal_pruning_script.py 
method: grid  
metric:
  name: Global/Test/Acc  
  goal: maximize

parameters:
  train_args:
    parameters:
      prune_percent: 
        values: [0.05,0.1,0.15,0.2,0.25]

        
command:
  - uv
  - run
  - --env-file
  - .env
  - --
  - ${program}
  - --cf
  - configs/har_config.yaml