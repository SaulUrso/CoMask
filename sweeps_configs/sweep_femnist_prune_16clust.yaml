program: scripts/cluster_prune_script.py 
method: grid  # or 'grid', 'random'
metric:
  name: Server/Test/Acc  # FedML typically logs as 'test/acc' or 'test_acc'
  goal: maximize

parameters:
  train_args:
    parameters:
      preference:
        values : [-43] # [-200, -90, -43]
      
      pruning: 
        values : ["proposal"]

      ssl_coefficient:
        values: [0.0001]

      accuracy_threshold:
        values : [0.4]

      prune_percent: 
        values: [0.05,0.15,0.2,0.25]

      consolidation_percentage: 
        values: [0.05,0.15,0.2,0.25]

  device_args:
    parameters:
      gpu_id: 
        values: [1]
        
command:
  - uv
  - run
  - --env-file
  - .env
  - --
  - ${program}
  - --cf
  - configs/femnist_config.yaml