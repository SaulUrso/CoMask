program: scripts/my_fedml_script.py 
method: grid  # or 'grid', 'random'
metric:
  name: Server/Test/Acc  # FedML typically logs as 'test/acc' or 'test_acc'
  goal: maximize

parameters:
  train_args:
    parameters:
      server_lr: 
        values : [0.1,0.3,0.5]
      
command:
  - uv
  - run
  - --env-file
  - .env
  - --
  - ${program}
  - --cf
  - configs/cifar_config.yaml