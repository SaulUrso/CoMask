program: scripts/cluster_prune_script.py
method: grid  # or 'grid', 'random'
metric:
  name: Server/Test/Acc  # FedML typically logs as 'test/acc' or 'test_acc'
  goal: maximize

parameters:
  train_args:
    parameters:
      preference:
        values : [-190,-46,-90]

      pruning:
        values : ["proposal"]

      ssl_coefficient:
        values: [0.00001]

      accuracy_threshold:
        values: [0.5]

      prune_percent: 
        values: [0.3]

      consolidation_percentage: 
        values: [0.3]

      consensus_percentage:
        values: [0]

      prune_counter:
        values: [1]

  device_args:
    parameters:
      gpu_id: 
        values: [1]

command:
  - uv
  - run
  - --env-file
  - .env
  - --
  - ${program}
  - --cf
  - configs/femnist_config.yaml

