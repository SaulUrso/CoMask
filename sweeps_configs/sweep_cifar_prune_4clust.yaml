program: scripts/cluster_prune_script.py 
method: grid  # or 'grid', 'random'
metric:
  name: Server/Test/Acc  # FedML typically logs as 'test/acc' or 'test_acc'
  goal: maximize

parameters:
  train_args:
    parameters:
      preference:
        values : [-60]

      pruning:
        values : ["proposal"]

      ssl_coefficient: 
        values : [0.000001]

      accuracy_threshold:
        values : [0.4]

      prune_percent: 
        values: [0.05,0.1,0.15,0.2,0.25]

      consolidation_percentage: 
        values: [0.05,0.1,0.15,0.2,0.25]
      
command:
  - uv
  - run
  - --env-file
  - .env
  - --
  - ${program}
  - --cf
  - configs/cifar_config.yaml