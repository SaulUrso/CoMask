common_args:
  training_type: "simulation"
  random_seed: 0

data_args:
  dataset: "harbox"
  partition_method: "natural"
  feature_col: user_id
  validation_split: 0.1 # only used by cluster_prune_script


model_args:
  model: "har_cnn"

train_args:
  federated_optimizer: "FedAvg" #should not matter
  client_id_list: "[]"  # Adjust based on num_clients
  client_num_in_total: 100 # ignored
  client_num_per_round: 10
  comm_round: 500
  learning_rate: 0.1
  weight_decay: 0
  epochs: 5
  batch_size: -1
  client_optimizer: "sgd"
# cluster params
  n_basis: 5
  preference: -190 # -90,-190 has 4
  group_method: clusters
# PACFL params (only used by pacfl_script.py)
  beta: 30          # distance-threshold cut, degrees [0,90]; or set n_clusters instead
  linkage_method: average
# pruning params
  pruning: "proposal" # "random"
  ssl_coefficient: 0
  prune_percent: 0.1
  accuracy_threshold: 0.3
  consolidation_percentage: 0.1
  consensus_percentage: 0.5

validation_args:
  frequency_of_the_test: 10
  # test_only_users: 0

device_args:
  using_gpu: true
  gpu_id: 0

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: true
  wandb_entity: s-urso2
  wandb_project: "FedTEST"
  run_name: "run_fedavg_har"

