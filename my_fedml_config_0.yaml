common_args:
  training_type: "simulation"
  random_seed: 0

data_args:
  dataset: "harbox"
  data_cache_dir: "./data"
  partition_method: "natural"  # Using custom partitioning

model_args:
  model: "har_cnn"

train_args:
  federated_optimizer: "FedAvg"
  client_id_list: "[]"  # Adjust based on num_clients
  client_num_in_total: 100
  client_num_per_round: 10
  comm_round: 200
  learning_rate: 0.1
  weight_decay: 0.01
  epochs: 5
  batch_size: -1
  client_optimizer: "sgd"


validation_args:
  frequency_of_the_test: 10

device_args:
  using_gpu: true
  gpu_id: 0

comm_args:
  backend: "sp"

tracking_args:
  enable_wandb: true
  wandb_entity: s-urso2
  wandb_project: "FedHAR"
  run_name: "run_cnn_har_trial"

